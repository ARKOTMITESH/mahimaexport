<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Mahima Global Entrepreneurs</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/admin.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" style="display:none;"></div>
  
  <!-- Admin Layout -->
  <div id="admin-layout" style="display:none;">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <span>Admin Portal</span>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-secondary" style="width:100%">🚪 Logout</button>
      </div>
    </aside>
    
    <main id="main-content">
      <header id="top-bar">
        <h1 id="page-title">Dashboard</h1>
        <div id="user-info">Admin User</div>
      </header>
      <div id="app-content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" style="display:none;">
    <div id="modal">
      <div id="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-container"></div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
